name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build

      - name: Run and verify output format
        run: |
          OUTPUT=$(./build/yocto-cache-test)
          echo "Output: $OUTPUT"
          echo "$OUTPUT" | grep -Pq '^yocto-cache-test [0-9a-f]+(\+dirty)? built [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}$'
          echo "Format check passed"
